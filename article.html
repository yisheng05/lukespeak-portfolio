<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Legacy URL: articles used to live at article.html?id=<id>. Each article now has
         its own pre-rendered page at articles/<id>.html (see scripts/build.mjs). This
         page only forwards old links, which are already shared on LinkedIn. -->
    <title>Lukespeak Engineering Insights</title>
    <meta name="robots" content="noindex">

    <!-- Crawlers can't run the redirect, so old links keep the site-wide preview -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Lukespeak Engineering Insights">
    <meta property="og:title" content="Lukespeak Engineering Insights">
    <meta property="og:description" content="Articles on AI architectures, agentic systems, and data products.">
    <meta property="og:image" content="https://yisheng05.github.io/lukespeak-portfolio/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        (function () {
            var id = new URLSearchParams(window.location.search).get('id');
            var target = id && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(id)
                ? 'articles/' + id + '.html'
                : 'articles.html';
            window.location.replace(target + window.location.hash);
        })();
    </script>
    <style>
        body { background: #0a0a0f; color: #a0a0b0; font-family: system-ui, sans-serif; text-align: center; padding: 4rem 1rem; }
        a { color: #6366f1; }
    </style>
</head>

<body>
    <p>Redirecting&hellip; If nothing happens, go to <a href="articles.html">all articles</a>.</p>
</body>

</html>
